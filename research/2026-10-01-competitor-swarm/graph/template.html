<title>Research Swarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed holographic graph (single dark "Jarvis" look by design), HUD panels floating at the corners. */
:root{
  color-scheme: dark;
  --void:#02060B; --deep:#061321; --cyan:#4FD8FF; --sky:#90C2E7; --ice:#D6F4FF; --amber:#FFB547; --green:#4FE3A1; --red:#FF5C6C; --violet:#9D8CFF;
  --text:#DCEFFF; --dim:rgba(220,239,255,.62); --faint:rgba(220,239,255,.38); --line:rgba(79,216,255,.22);
  --hud:"Rajdhani",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; --ui:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--text);font:13px/1.45 var(--ui);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c.drag{cursor:grabbing}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(79,216,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
.panel{position:fixed;background:rgba(4,16,28,.72);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:10px;box-shadow:0 0 0 1px rgba(79,216,255,.06) inset,0 0 30px rgba(79,216,255,.08)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--cyan);border-style:solid;opacity:.8}
.panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:10px 0 0 0}
.panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 10px 0}
.hud-title{top:calc(14px + env(safe-area-inset-top,0px));left:14px;padding:12px 16px;max-width:min(440px,calc(100vw - 28px))}
.hud-title h1{margin:0;font:700 22px/1 var(--hud);letter-spacing:.14em;text-transform:uppercase;color:var(--ice);text-shadow:0 0 18px rgba(79,216,255,.6)}
.hud-title .sub{margin-top:6px;font:500 11px/1.4 var(--mono);color:var(--dim);letter-spacing:.04em}
.hud-title .sub b{color:var(--cyan);font-weight:500}
.stats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.stat{display:grid;gap:2px}
.stat b{font:700 22px/1 var(--hud);color:var(--ice);font-variant-numeric:tabular-nums}
.stat span{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.agents{top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:300px;padding:12px 14px;display:grid;gap:8px;max-height:46vh;overflow:auto}
.ph{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);display:flex;justify-content:space-between;align-items:center}
.ag{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer;background:none;color:inherit;text-align:left;font:inherit;width:100%}
.ag:hover,.ag:focus-visible{border-color:var(--line);background:rgba(79,216,255,.05);outline:none}
.ag .l{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--hud);color:var(--void);background:var(--cyan);box-shadow:0 0 14px rgba(79,216,255,.7)}
.ag.stopped .l{background:#56707f;box-shadow:none}
.ag.done .l{background:var(--green);box-shadow:0 0 14px rgba(79,227,161,.6)}
.ag .n{font:600 13px/1.2 var(--ui);color:var(--text)}
.ag .m{font:400 11px/1.3 var(--mono);color:var(--faint)}
.pill{font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:4px;border:1px solid}
.pill.running{color:var(--cyan);border-color:rgba(79,216,255,.5);animation:blink 1.6s ease-in-out infinite}
.pill.done{color:var(--green);border-color:rgba(79,227,161,.5)}
.pill.stopped{color:#8aa3b0;border-color:rgba(138,163,176,.4)}
@keyframes blink{50%{opacity:.45}}
.feed{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:14px;width:380px;max-height:34vh;padding:12px 14px;display:grid;gap:6px;grid-template-rows:auto 1fr}
.feed ol{list-style:none;margin:0;padding:0;overflow:auto;display:grid;gap:3px;align-content:start}
.feed li{display:grid;grid-template-columns:22px 58px 1fr;gap:8px;font:400 11px/1.4 var(--mono);color:var(--dim);min-width:0}
.feed li .a{color:var(--cyan);font-weight:500}
.feed li .k{text-transform:uppercase;letter-spacing:.08em}
.feed li .k.search{color:var(--amber)} .feed li .k.fetch{color:var(--sky)} .feed li .k.browser{color:var(--violet)}
.feed li .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.legend{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;padding:10px 14px;display:flex;gap:12px;flex-wrap:wrap;max-width:min(560px,calc(100vw - 28px))}
.lg{display:flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);color:var(--dim);cursor:pointer;user-select:none;background:none;border:0;padding:4px 2px}
.lg i{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
.lg.off{opacity:.35}
.lg:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
.detail{top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 28px));max-height:70vh;overflow:auto;padding:18px 20px;display:none}
.detail.on{display:block}
.detail h2{margin:0 0 6px;font:700 20px/1.15 var(--hud);letter-spacing:.06em;color:var(--ice);text-wrap:balance}
.detail .ty{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.detail p{margin:10px 0 0;color:var(--dim);font-size:13px}
.detail ul{margin:10px 0 0;padding-left:16px;display:grid;gap:4px;font:400 11.5px/1.4 var(--mono);color:var(--dim);word-break:break-all}
.detail button.x{position:absolute;top:10px;right:10px;background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 8px;font:500 11px/1 var(--mono);cursor:pointer}
.tip{position:fixed;pointer-events:none;padding:6px 9px;border-radius:6px;background:rgba(2,10,18,.92);border:1px solid var(--line);font:500 11px/1.35 var(--mono);color:var(--ice);max-width:320px;display:none;z-index:9}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));font:500 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase;pointer-events:none}
@media (max-width:820px){
  .agents{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:14px;left:14px;width:auto;max-height:30vh}
  .feed,.legend,.hint{display:none}
  .hud-title{right:14px;max-width:none}
}
@media (prefers-reduced-motion:reduce){.pill.running{animation:none}}
</style>

<canvas id="c" aria-label="Research swarm graph"></canvas>
<div class="scan"></div><div class="vign"></div>
<div class="hint">drag · scroll to zoom · click a node</div>

<section class="panel hud-title">
  <h1>Research Swarm</h1>
  <div class="sub">FiguredOutAI · competitor study for the <b>Unified AI Inbox</b><br>snapshot <span id="built"></span></div>
  <div class="stats">
    <div class="stat"><b id="sA">0</b><span>agents</span></div>
    <div class="stat"><b id="sS">0</b><span>searches</span></div>
    <div class="stat"><b id="sP">0</b><span>sites</span></div>
    <div class="stat"><b id="sC">0</b><span>competitors</span></div>
    <div class="stat"><b id="sL">0</b><span>need login</span></div>
  </div>
</section>

<section class="panel agents" aria-label="Agents">
  <div class="ph"><span>Agents</span><span id="runCount"></span></div>
  <div id="agList" style="display:grid;gap:4px"></div>
</section>

<section class="panel feed" aria-label="Activity feed">
  <div class="ph"><span>Live activity</span><span style="color:var(--faint)">latest 80</span></div>
  <ol id="feed"></ol>
</section>

<section class="panel legend" aria-label="Legend" id="legend"></section>

<section class="panel detail" id="detail" role="dialog" aria-modal="false">
  <button class="x" id="dx" type="button">Close</button>
  <div class="ty" id="dty"></div><h2 id="dh"></h2><p id="dp"></p><ul id="du"></ul>
</section>
<div class="tip" id="tip"></div>

<script>
(() => {
const G = /*__DATA__*/null;
const TYPES = {
  orch:{c:'#D6F4FF',r:26,label:'Orchestrator'}, agent:{c:'#4FD8FF',r:15,label:'Agent'}, search:{c:'#FFB547',r:4.5,label:'Search'},
  site:{c:'#90C2E7',r:6,label:'Website'}, competitor:{c:'#4FE3A1',r:9,label:'Competitor / tool'}, login:{c:'#FF5C6C',r:6.5,label:'Needs login'},
  verdict:{c:'#9D8CFF',r:12,label:'Synthesis'}
};
const hidden = new Set();
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
function size(){ W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
size(); addEventListener('resize', size);

/* ---------- data ---------- */
const nodes = G.nodes.map(n => ({...n}));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const links = G.links.filter(l => byId[l.s] && byId[l.t]).map(l => ({...l, s: byId[l.s], t: byId[l.t]}));
const agents = nodes.filter(n => n.type === 'agent');
agents.forEach((a, i) => { const ang = i / agents.length * Math.PI * 2 - Math.PI / 2; a.x = Math.cos(ang) * 230; a.y = Math.sin(ang) * 230; });
nodes.forEach(n => {
  if (n.type === 'orch') { n.x = 0; n.y = 0; n.fixed = true; }
  else if (n.type === 'verdict') { n.x = (n.id === 'SOP' ? 70 : -70); n.y = 90; }
  else if (n.x === undefined) {
    const par = links.find(l => l.t === n && l.s.type === 'agent')?.s || links.find(l => l.s === n)?.t;
    const px = par?.x ?? 0, py = par?.y ?? 0, a = Math.random() * 6.283, r = 60 + Math.random() * 90;
    n.x = px * 1.5 + Math.cos(a) * r; n.y = py * 1.5 + Math.sin(a) * r;
  }
  n.vx = 0; n.vy = 0; n.deg = 0;
});
links.forEach(l => { l.s.deg++; l.t.deg++; });

/* ---------- HUD ---------- */
const $ = id => document.getElementById(id);
$('built').textContent = G.built;
$('sA').textContent = G.agents.length;
$('sS').textContent = nodes.filter(n => n.type === 'search').length;
$('sP').textContent = nodes.filter(n => n.type === 'site').length;
$('sC').textContent = nodes.filter(n => n.type === 'competitor').length;
$('sL').textContent = nodes.filter(n => n.type === 'login').length;
const running = G.agents.filter(a => a.status === 'running').length;
$('runCount').textContent = `${running} running`;
$('agList').innerHTML = G.agents.map(a => `<button class="ag ${a.status}" data-id="AG_${a.letter}" type="button">
  <span class="l">${a.letter}</span><span><div class="n">${a.seg}</div><div class="m">${a.search} searches · ${a.fetch + a.browser} pages</div></span>
  <span class="pill ${a.status}">${a.status}</span></button>`).join('');
document.querySelectorAll('.ag').forEach(b => b.addEventListener('click', () => focusNode(byId[b.dataset.id])));
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
$('feed').innerHTML = G.feed.slice().reverse().map(f => `<li><span class="a">${f.agent}</span><span class="k ${f.kind}">${f.kind}</span><span class="u" title="${esc(f.label)}">${esc(f.label)}</span></li>`).join('') || '<li><span></span><span></span><span class="u">Waiting for the first tool calls…</span></li>';
$('legend').innerHTML = Object.entries(TYPES).map(([k, t]) => `<button class="lg" data-k="${k}" type="button"><i style="background:${t.c};color:${t.c}"></i>${t.label}</button>`).join('');
document.querySelectorAll('.lg').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; hidden.has(k) ? hidden.delete(k) : hidden.add(k); b.classList.toggle('off'); }));

/* ---------- camera ---------- */
let cam = {x: 0, y: 0, z: Math.min(W, H) / 900};
const toWorld = (sx, sy) => ({x: (sx - W / 2) / cam.z + cam.x, y: (sy - H / 2) / cam.z + cam.y});
function focusNode(n){ if (!n) return; anim = {fx: cam.x, fy: cam.y, fz: cam.z, tx: n.x, ty: n.y, tz: Math.max(cam.z, 1.3), t0: performance.now()}; showDetail(n); }
let anim = null;

/* ---------- simulation ---------- */
let alpha = 1;
const REST = {spawn: 230, search: 70, fetch: 95, browser: 95, finding: 120, evidence: 140, login: 90, synth: 110, feeds: 200, flow: 90};
function tick(){
  const vis = nodes;
  for (let i = 0; i < vis.length; i++) {
    const a = vis[i];
    for (let j = i + 1; j < vis.length; j++) {
      const b = vis[j]; let dx = b.x - a.x, dy = b.y - a.y; let d2 = dx * dx + dy * dy + 0.01;
      if (d2 > 160000) continue;
      const big = (TYPES[a.type].r + TYPES[b.type].r);
      const f = (900 + big * 60) / d2 * alpha;
      const d = Math.sqrt(d2); dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
  }
  for (const l of links) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.sqrt(dx * dx + dy * dy) + 0.01;
    const k = (d - (REST[l.k] || 100)) * 0.012 * alpha;
    const fx = dx / d * k, fy = dy / d * k;
    l.s.vx += fx; l.s.vy += fy; l.t.vx -= fx; l.t.vy -= fy;
  }
  for (const n of vis) {
    if (n.fixed || n === dragNode) { n.vx = n.vy = 0; continue; }
    n.vx -= n.x * 0.0009 * alpha; n.vy -= n.y * 0.0009 * alpha;
    n.vx *= 0.82; n.vy *= 0.82; n.x += n.vx; n.y += n.vy;
  }
  alpha = Math.max(0.06, alpha * 0.992);
}

/* ---------- stars ---------- */
const stars = Array.from({length: 220}, () => ({x: Math.random() * 3000 - 1500, y: Math.random() * 3000 - 1500, r: Math.random() * 1.2 + .2, p: Math.random() * 6}));

/* ---------- render ---------- */
let hover = null, selected = null, t0 = performance.now();
function draw(now){
  const t = (now - t0) / 1000;
  if (anim) { const p = Math.min(1, (now - anim.t0) / 700), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    cam.x = anim.fx + (anim.tx - anim.fx) * e; cam.y = anim.fy + (anim.ty - anim.fy) * e; cam.z = anim.fz + (anim.tz - anim.fz) * e; if (p >= 1) anim = null; }
  tick();
  const bg = cx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7);
  bg.addColorStop(0, '#071A2C'); bg.addColorStop(.55, '#040E1A'); bg.addColorStop(1, '#02060B');
  cx.fillStyle = bg; cx.fillRect(0, 0, W, H);
  cx.save(); cx.translate(W / 2, H / 2); cx.scale(cam.z, cam.z); cx.translate(-cam.x, -cam.y);
  // stars (parallax-free, subtle twinkle)
  for (const s of stars) { cx.globalAlpha = .25 + .2 * Math.sin(t * 1.3 + s.p); cx.fillStyle = '#9FD8FF'; cx.beginPath(); cx.arc(s.x, s.y, s.r / cam.z, 0, 6.283); cx.fill(); }
  cx.globalAlpha = 1;
  // HUD rings around the orchestrator
  const O = byId.ORCH; cx.save(); cx.translate(O.x, O.y);
  for (let k = 0; k < 4; k++) {
    const R = 60 + k * 38; cx.strokeStyle = `rgba(79,216,255,${.32 - k * .06})`; cx.lineWidth = 1.2 / cam.z;
    cx.beginPath(); const s0 = t * (k % 2 ? -.35 : .25) + k; cx.arc(0, 0, R, s0, s0 + Math.PI * (1.1 + k * .2)); cx.stroke();
    for (let m = 0; m < 24; m++) { const a = m / 24 * 6.283 + t * .1 * (k % 2 ? 1 : -1); const r1 = R + 4, r2 = R + (m % 6 ? 8 : 14);
      cx.beginPath(); cx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); cx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); cx.stroke(); }
  }
  cx.restore();
  // links
  for (const l of links) {
    if (hidden.has(l.s.type) || hidden.has(l.t.type)) continue;
    const hot = selected && (l.s === selected || l.t === selected);
    cx.strokeStyle = hot ? 'rgba(214,244,255,.75)' : (l.k === 'spawn' ? 'rgba(79,216,255,.45)' : l.k === 'login' ? 'rgba(255,92,108,.35)' : l.k === 'finding' || l.k === 'feeds' ? 'rgba(79,227,161,.32)' : 'rgba(79,216,255,.16)');
    cx.lineWidth = (l.k === 'spawn' ? 1.8 : 1) / cam.z * (hot ? 1.8 : 1);
    cx.beginPath(); cx.moveTo(l.s.x, l.s.y); cx.lineTo(l.t.x, l.t.y); cx.stroke();
    // data pulses on active agent links
    const ag = l.s.type === 'agent' ? l.s : null;
    if ((l.k === 'spawn' && l.t.status === 'running') || (ag && ag.status === 'running' && (l.k === 'search' || l.k === 'fetch' || l.k === 'browser' || l.k === 'flow'))) {
      const sp = l.k === 'spawn' ? .45 : .8, ph = ((t * sp + (l.t.x * .013)) % 1 + 1) % 1;
      const px = l.s.x + (l.t.x - l.s.x) * ph, py = l.s.y + (l.t.y - l.s.y) * ph;
      cx.fillStyle = l.k === 'spawn' ? '#D6F4FF' : '#4FD8FF'; cx.shadowColor = '#4FD8FF'; cx.shadowBlur = 10;
      cx.beginPath(); cx.arc(px, py, (l.k === 'spawn' ? 3 : 2) / Math.sqrt(cam.z), 0, 6.283); cx.fill(); cx.shadowBlur = 0;
    }
  }
  // nodes
  for (const n of nodes) {
    if (hidden.has(n.type)) continue;
    const T = TYPES[n.type]; let r = T.r + (n.type === 'site' ? Math.min(6, (n.urls?.length || 1) - 1) : 0);
    const col = n.type === 'agent' && n.status === 'stopped' ? '#56707F' : n.type === 'agent' && n.status === 'done' ? '#4FE3A1' : (n.social ? '#E87BFF' : T.c);
    const isSel = n === selected || n === hover;
    cx.shadowColor = col; cx.shadowBlur = (n.type === 'orch' ? 40 : n.type === 'agent' ? 24 : 12) * (isSel ? 1.6 : 1);
    cx.fillStyle = col;
    if (n.type === 'orch') {
      const pulse = 1 + .06 * Math.sin(t * 2.2);
      const g = cx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 1.8 * pulse); g.addColorStop(0, '#FFFFFF'); g.addColorStop(.35, '#9BE8FF'); g.addColorStop(1, 'rgba(79,216,255,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(n.x, n.y, r * 1.8 * pulse, 0, 6.283); cx.fill();
    } else {
      cx.beginPath(); cx.arc(n.x, n.y, r, 0, 6.283); cx.fill();
      if (n.type === 'agent') {
        cx.shadowBlur = 0; cx.fillStyle = '#02101C'; cx.beginPath(); cx.arc(n.x, n.y, r - 3.5, 0, 6.283); cx.fill();
        cx.fillStyle = col; cx.font = `700 ${15}px Rajdhani, sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(n.id.slice(3), n.x, n.y + 1);
        if (n.status === 'running') { cx.strokeStyle = col; cx.lineWidth = 2 / cam.z; cx.beginPath(); const s0 = t * 3; cx.arc(n.x, n.y, r + 6, s0, s0 + 1.6); cx.stroke(); }
      }
      if (n.type === 'competitor' && n.close != null) { cx.shadowBlur = 0; cx.strokeStyle = 'rgba(79,227,161,.7)'; cx.lineWidth = 2 / cam.z; cx.beginPath(); cx.arc(n.x, n.y, r + 4, -Math.PI / 2, -Math.PI / 2 + 6.283 * Math.min(1, n.close / 5)); cx.stroke(); }
    }
    cx.shadowBlur = 0;
    // labels
    const showLabel = n.type === 'orch' || n.type === 'agent' || n.type === 'competitor' || n.type === 'verdict' || isSel || (cam.z > 1.5 && n.type === 'site') || (cam.z > 2.2);
    if (showLabel) {
      const fs = (n.type === 'orch' ? 15 : n.type === 'agent' ? 12.5 : 11) / Math.max(.7, cam.z) * Math.min(1.4, Math.max(.9, cam.z));
      cx.font = `${n.type === 'orch' || n.type === 'agent' ? 700 : 500} ${fs}px ${n.type === 'orch' || n.type === 'agent' ? 'Rajdhani' : 'JetBrains Mono'}, sans-serif`;
      cx.textAlign = 'center'; cx.textBaseline = 'top'; cx.fillStyle = n.type === 'orch' ? '#D6F4FF' : 'rgba(220,239,255,.82)';
      let lab = n.type === 'agent' ? n.label.replace(/^Agent \w · /, '') : n.label; if (lab.length > 42) lab = lab.slice(0, 40) + '…';
      cx.fillText(n.type === 'orch' ? 'ORCHESTRATOR' : lab, n.x, n.y + r + 6 + (n.type === 'orch' ? 22 : 0));
    }
  }
  cx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- interaction ---------- */
function pick(sx, sy){ const p = toWorld(sx, sy); let best = null, bd = 1e9;
  for (const n of nodes) { if (hidden.has(n.type)) continue; const r = TYPES[n.type].r + 6 / cam.z; const d = (n.x - p.x) ** 2 + (n.y - p.y) ** 2; if (d < r * r * 2.2 && d < bd) { bd = d; best = n; } } return best; }
let dragNode = null, panning = null, moved = false;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); moved = false; const n = pick(e.clientX, e.clientY);
  if (n) { dragNode = n; alpha = Math.max(alpha, .4); } else panning = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y}; cv.classList.add('drag'); });
cv.addEventListener('pointermove', e => {
  if (dragNode) { const p = toWorld(e.clientX, e.clientY); dragNode.x = p.x; dragNode.y = p.y; moved = true; return; }
  if (panning) { cam.x = panning.cx - (e.clientX - panning.x) / cam.z; cam.y = panning.cy - (e.clientY - panning.y) / cam.z; moved = true; return; }
  hover = pick(e.clientX, e.clientY); const tip = $('tip');
  if (hover) { tip.style.display = 'block'; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; tip.textContent = (TYPES[hover.type].label + ' · ' + hover.label).slice(0, 160); cv.style.cursor = 'pointer'; }
  else { tip.style.display = 'none'; cv.style.cursor = ''; }
});
cv.addEventListener('pointerup', e => { cv.classList.remove('drag'); const n = dragNode; dragNode = null; panning = null; if (!moved) { const hit = pick(e.clientX, e.clientY); if (hit) { selected = hit; showDetail(hit); } else { selected = null; $('detail').classList.remove('on'); } } });
cv.addEventListener('wheel', e => { e.preventDefault(); const p = toWorld(e.clientX, e.clientY); const z = Math.min(5, Math.max(.25, cam.z * Math.exp(-e.deltaY * .0015)));
  cam.x = p.x - (e.clientX - W / 2) / z; cam.y = p.y - (e.clientY - H / 2) / z; cam.z = z; }, {passive: false});
addEventListener('keydown', e => { if (e.key === 'Escape') { selected = null; $('detail').classList.remove('on'); } if (e.key === 'f' || e.key === 'F') { anim = {fx: cam.x, fy: cam.y, fz: cam.z, tx: 0, ty: 0, tz: Math.min(W, H) / 900, t0: performance.now()}; } });
$('dx').addEventListener('click', () => { selected = null; $('detail').classList.remove('on'); });
function showDetail(n){
  selected = n; $('dty').textContent = TYPES[n.type].label + (n.status ? ' · ' + n.status : '') + (n.close != null ? ` · closeness ${n.close}/5` : '');
  $('dh').textContent = n.label; $('dp').textContent = n.detail || '';
  const ul = $('du'); ul.innerHTML = '';
  const conn = links.filter(l => l.s === n || l.t === n).map(l => l.s === n ? l.t : l.s);
  const items = (n.urls || []).slice(0, 14).map(u => esc(u));
  if (n.type === 'agent') items.push(...conn.filter(c => c.type === 'search').slice(0, 12).map(c => '🔎 ' + esc(c.label)));
  if (!items.length) items.push(...conn.slice(0, 12).map(c => esc(TYPES[c.type].label + ': ' + c.label)));
  ul.innerHTML = items.map(i => `<li>${i}</li>`).join('');
  $('detail').classList.add('on');
}
})();
</script>
